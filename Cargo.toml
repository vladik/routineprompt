[workspace]
members = [
    "crates/domain",
    "crates/storage",
    "crates/scheduler",
    "src-tauri",
]
resolver = "2"

[workspace.dependencies]
domain    = { path = "crates/domain" }

uuid     = { version = "1", features = ["v4", "serde"] }
chrono   = { version = "0.4", features = ["serde"] }
serde    = { version = "1", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
anyhow    = "1"
dirs      = "5"
winreg    = "0.52"
